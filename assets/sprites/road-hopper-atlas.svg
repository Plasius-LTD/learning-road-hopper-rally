<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128" role="img" aria-labelledby="title desc">
  <title id="title">Road Hopper Rally original sprite atlas</title>
  <desc id="desc">Original geometric sprites for a green hopper, rescue vehicles, river floats, turtles, a gator and bonus stars.</desc>
  <rect width="256" height="128" fill="#0f172a"/>
  <g id="hopper" transform="translate(8 8)">
    <rect x="8" y="8" width="32" height="24" rx="8" fill="#65d46e"/>
    <circle cx="14" cy="8" r="7" fill="#b8f7a8"/><circle cx="34" cy="8" r="7" fill="#b8f7a8"/>
    <circle cx="14" cy="7" r="2" fill="#13251a"/><circle cx="34" cy="7" r="2" fill="#13251a"/>
    <path d="M8 22 0 34h16M40 22l8 12H32" stroke="#65d46e" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="vehicle" transform="translate(64 12)">
    <rect x="0" y="8" width="48" height="24" rx="6" fill="#ff7a59"/>
    <rect x="12" y="0" width="24" height="16" rx="5" fill="#ffd166"/>
    <circle cx="10" cy="34" r="5" fill="#111827"/><circle cx="38" cy="34" r="5" fill="#111827"/>
  </g>
  <g id="log" transform="translate(128 20)">
    <rect width="56" height="20" rx="10" fill="#a96c3d"/>
    <circle cx="8" cy="10" r="5" fill="#d9a066"/><path d="M20 6h25M20 14h18" stroke="#77462c" stroke-width="3"/>
  </g>
  <g id="turtle" transform="translate(200 12)" fill="#5dd6c0">
    <ellipse cx="20" cy="18" rx="15" ry="12"/><circle cx="38" cy="18" r="6"/>
    <path d="M8 8 0 2M8 28 0 34M28 8l7-7M28 28l7 7" stroke="#5dd6c0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="gator" transform="translate(8 76)">
    <path d="M0 20 20 4h52l20 16-20 16H20Z" fill="#77b255"/>
    <path d="m74 20 18-8v16Z" fill="#f8fafc"/><circle cx="24" cy="12" r="3" fill="#111827"/>
  </g>
  <g id="bonus" transform="translate(124 74)">
    <path d="m22 0 7 15 16 2-12 11 4 16-15-8-15 8 4-16L0 17l16-2Z" fill="#ffe66d"/>
  </g>
  <g id="home" transform="translate(184 76)">
    <path d="M0 20 28 0l28 20v28H0Z" fill="#7dd3fc"/><rect x="21" y="28" width="14" height="20" fill="#1e3a5f"/>
  </g>
</svg>
